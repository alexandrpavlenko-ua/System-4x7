                                className="flex items-center gap-1 px-1 py-0.5 rounded cursor-pointer hover:bg-indigo-50 group transition-colors"
                                draggable
                                onDragStart={() => setDraggedTaskId(task.id)}
                                onClick={() => setSelectedTask(task)}
                              >
                                {/* чекбокс выполнения */}
                                <button
                                  className={`flex items-center justify-center w-3.5 h-3.5 rounded border transition-all mr-0.5 ${
                                    isDone
                                      ? "bg-green-500 border-green-500"
                                      : "border-gray-300 bg-white hover:border-green-500"
                                  }`}
                                  onClick={(e) => {
                                    e.stopPropagation();
                                    if (!isDone) {
                                      onMarkDone(task.id);
                                    }
                                  }}
                                  title="Отметить выполненной"
                                >
                                  {isDone && (
                                    <Check size={9} className="text-white" />
                                  )}
                                </button>

                                {/* цвет категории */}
                                <span
                                  className="w-1 h-3 rounded-full"
                                  style={{
                                    backgroundColor: catColor,
                                  }}
                                />

                                <div className="flex-1 min-w-0">
                                  <div
                                    className={`truncate text-[11px] ${
                                      isDone
                                        ? "line-through text-gray-400"
                                        : "text-gray-800"
                                    }`}
                                  >
                                    {task.title}
                                  </div>
                                  {timeStr && (
                                    <div className="text-[10px] text-gray-400">
                                      {timeStr}
                                    </div>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                          {dayTasks.length > 3 && (
                            <button
                              className="w-full text-[10px] text-left text-indigo-600 mt-0.5 px-1 py-0.5 rounded hover:bg-indigo-50"
                              onClick={() =>
                                setSelectedTask({
                                  _day: dayNumber,
                                  _list: dayTasks,
                                })
                              }
                            >
                              ещё {dayTasks.length - 3}…
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {selectedTask && (
              <CalendarTaskModal
                task={selectedTask}
                categories={categories}
                getProjectName={getProjectName}
                onClose={() => setSelectedTask(null)}
                onMarkDone={onMarkDone}
              />
            )}
          </div>
        );
      };

      const CalendarTaskModal = ({
        task,
        categories,
        getProjectName,
        onClose,
        onMarkDone,
      }) => {
        const isDayList = task._list && Array.isArray(task._list);

        const renderSingleTask = (t) => {
          const cat = categories.find((c) => c.name === t.category);
          const catColor = cat ? cat.color : "#9ca3af";

          const d = t.dueDate ? new Date(t.dueDate) : null;
          const dateStr = d
            ? d.toLocaleString("ru-RU", {
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit",
              })
            : "—";

          const projectName = t.projectId ? getProjectName(t.projectId) : null;

          const durationText = formatTimeText(t.totalTime || 0);
          const isDone = t.status === "done";

          return (
            <div>
              <h3
                className={`text-lg font-bold mb-1 ${
                  isDone ? "text-gray-500 line-through" : "text-gray-800"
                }`}
              >
                {t.title}
              </h3>
              <div className="flex items-center gap-2 mb-4">
                <span
                  className="text-xs px-2 py-1 rounded text-white"
                  style={{ backgroundColor: catColor }}
                >
                  {t.category}
                </span>
                {projectName && (
                  <span className="text-xs px-2 py-1 rounded bg-blue-50 text-blue-700 flex items-center gap-1">
                    <Folder size={12} />
                    {projectName}
                  </span>
                )}
                <span
                  className={`text-xs px-2 py-1 rounded ${getStatusColor(
                    t.status
                  )}`}
                >
                  {getStatusLabel(t.status)}
                </span>
              </div>

              <div className="space-y-2 text-sm text-gray-700">
                <div>
                  <span className="font-semibold">Дата и время: </span>
                  {dateStr}
                </div>
                <div>
                  <span className="font-semibold">Длительность: </span>
                  {durationText}
                </div>
              </div>

              <div className="mt-4">
                <button
                  onClick={() => {
                    if (!isDone) onMarkDone(t.id);
                  }}
                  className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${
                    isDone
                      ? "bg-green-100 text-green-700 cursor-default"
                      : "bg-green-600 text-white hover:bg-green-700"
                  }`}
                >
                  <Check size={14} />
                  {isDone ? "Задача выполнена" : "Отметить выполненной"}
                </button>
              </div>

              <div className="text-xs text-gray-400 mt-3">
                (Описание, файлы и другие поля можно добавить, когда появятся в
                задаче)
              </div>
            </div>
          );
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
            <div className="bg-white rounded-xl shadow-xl max-w-lg w-full p-5 relative">
              <button
                onClick={onClose}
                className="absolute top-3 right-3 text-gray-400 hover:text-gray-600"
              >
                <X size={18} />
              </button>

              {isDayList ? (
                <div>
                  <h3 className="text-lg font-bold text-gray-800 mb-3">
                    Задачи за {task._day} число
                  </h3>
                  <div className="space-y-3 max-h-[60vh] overflow-y-auto">
                    {task._list.map((t) => (
                      <div
                        key={t.id}
                        className="p-3 border rounded-lg bg-gray-50"
                      >
                        {renderSingleTask(t)}
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                renderSingleTask(task)
              )}
            </div>
          </div>
        );
      };

      const ListView = ({
        title,
        icon,
        tasks,
        color,
        showDelegateInfo,
        onDelete,
        onComplete,
        activeTimer,
        onStart,
        onPause,
        onStop,
        getDuration,
        getProjectName,
        categories,
      }) => (
        <div className="space-y-6">
          <header className="flex items-center gap-3">
            <div className={`p-3 rounded-lg ${color || "bg-gray-100"}`}>
              {icon}
            </div>
            <h2 className="text-2xl font-bold text-gray-800">{title}</h2>
            <span className="ml-auto text-gray-400 text-sm">
              {tasks.length} items
            </span>
          </header>
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            {tasks.length === 0 ? (
              <div className="p-8 text-center text-gray-400">Список пуст</div>
            ) : (
              <ul>
                {tasks.map((task) => (
                  <TaskItem
                    key={task.id}
                    task={task}
                    onComplete={onComplete}
                    onDelete={onDelete}
                    activeTimer={activeTimer}
                    onStart={onStart}
                    onPause={onPause}
                    onStop={onStop}
                    getDuration={getDuration}
                    getProjectName={getProjectName}
                    categories={categories}
                  />
                ))}
              </ul>
            )}
          </div>
        </div>
      );

      const ProjectsView = ({
        allTasks,
        projects,
        onAddTask,
        onDelete,
        onComplete,
        activeTimer,
        onStart,
        onPause,
        onStop,
        getDuration,
        categories,
      }) => {
        const [newTaskTitles, setNewTaskTitles] = useState({});

        const handleAddTask = (projectId, projectCategory) => {
          const title = newTaskTitles[projectId];
          if (!title || !title.trim()) return;
          onAddTask({
            title,
            category: projectCategory,
            projectId: projectId,
            status: "inbox",
          });
          setNewTaskTitles((prev) => ({ ...prev, [projectId]: "" }));
          alert('Задача добавлена во "Входящие"');
        };

        return (
          <div className="space-y-6">
            <header className="flex items-center gap-3">
              <div className="p-3 rounded-lg bg-blue-100 text-blue-600">
                <Layers />
              </div>
              <h2 className="text-2xl font-bold text-gray-800">Проекты</h2>
            </header>
            <div className="grid gap-6 md:grid-cols-2">
              {projects.length === 0 ? (
                <div className="col-span-full text-center text-gray-400 py-10">
                  Нет проектов
                </div>
              ) : (
                projects.map((project) => {
                  const linkedTasks = allTasks.filter(
                    (t) => t.projectId === project.id && t.status !== "done"
                  );
                  return (
                    <div
                      key={project.id}
                      className={`bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col h-full relative ${
                        activeTimer.taskId === project.id
                          ? "ring-2 ring-indigo-500"
                          : ""
                      }`}
                    >
                      <div className="absolute top-4 right-4 flex gap-2">
                        <button
                          onClick={() => onComplete(project.id)}
                          className="text-gray-300 hover:text-green-500"
                        >
                          <CheckCircle size={20} />
                        </button>
                      </div>
                      <div className="mb-4 border-b border-gray-100 pb-4">
                        <div className="text-xs uppercase tracking-wide text-blue-600 font-bold mb-1">
                          Проект
                        </div>
                        <h3 className="text-xl font-bold text-gray-800 mb-2">
                          {project.title}
                        </h3>
                        <div className="text-sm text-gray-600 bg-blue-50 p-2 rounded mb-2">
                          <strong>Цель:</strong> {project.project?.outcome}
                        </div>
                        {linkedTasks.length > 0 && (
                          <div className="mt-3">
                            <div className="text-xs font-bold text-gray-400 uppercase mb-1">
                              Активные задачи ({linkedTasks.length})
                            </div>
                            <ul className="space-y-1 max-h-32 overflow-y-auto">
                              {linkedTasks.map((lt) => (
                                <li
                                  key={lt.id}
                                  className="text-xs flex items-center justify-between text-gray-600 bg-gray-50 p-1 rounded"
                                >
                                  <span>{lt.title}</span>
                                  <span
                                    className={`px-1.5 py-0.5 rounded text-[10px] ${getStatusColor(
                                      lt.status
                                    )}`}
                                  >
                                    {getStatusLabel(lt.status)}
                                  </span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        )}
                      </div>
                      <div className="mb-4">
                        <div className="flex gap-2">
                          <input
                            type="text"
                            placeholder="Новая задача в проект..."
                            className="flex-1 text-sm border rounded px-2 py-1"
                            value={newTaskTitles[project.id] || ""}
                            onChange={(e) =>
                              setNewTaskTitles({
                                ...newTaskTitles,
                                [project.id]: e.target.value,
                              })
                            }
                            onKeyDown={(e) =>
                              e.key === "Enter" &&
                              handleAddTask(project.id, project.category)
                            }
                          />
                          <button
                            onClick={() =>
                              handleAddTask(project.id, project.category)
                            }
                            className="bg-indigo-600 text-white p-1.5 rounded hover:bg-indigo-700"
                            title="Добавить во Входящие"
                          >
                            <Plus size={16} />
                          </button>
                        </div>
                        <div className="text-[10px] text-gray-400 mt-1 text-right">
                          Попадает во "Входящие"
                        </div>
                      </div>
                      <div className="mt-auto pt-2 flex justify-between items-end">
                        <div>
                          <div className="text-xs font-semibold text-gray-400 uppercase mb-2">
                            Следующий шаг (Base)
                          </div>
                          <div className="flex items-center gap-2 text-gray-800">
                            <div className="w-2 h-2 rounded-full bg-green-500"></div>
                            {project.project?.firstStep}
                          </div>
                        </div>
                        <div className="flex flex-col items-end gap-2">
                          <TimerControl
                            taskId={project.id}
                            isActive={activeTimer.taskId === project.id}
                            isRunning={activeTimer.isRunning}
                            accumulated={project.totalTime || 0}
                            onStart={onStart}
                            onPause={onPause}
                            onStop={onStop}
                            getDuration={getDuration}
                          />
                          <button
                            onClick={() => onDelete(project.id)}
                            className="text-xs text-red-300 hover:text-red-500 mt-2"
                          >
                            Архив
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>
        );
      };

      const DoneView = ({
        tasks,
        onDelete,
        onRepeat,
        getProjectName,
        categories,
      }) => (
        <div className="space-y-6">
          <header className="flex items-center gap-3">
            <div className="p-3 rounded-lg bg-green-100 text-green-600">
              <CheckCircle />
            </div>
            <h2 className="text-2xl font-bold text-gray-800">Выполнено</h2>
          </header>
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            {tasks.length === 0 ? (
              <div className="p-8 text-center text-gray-400">Пусто</div>
            ) : (
              <ul>
                {tasks.map((task) => (
                  <li
                    key={task.id}
                    className="p-4 flex items-center justify-between hover:bg-gray-50"
                  >
                    <div className="flex items-center gap-3 opacity-60">
                      <Check size={16} className="text-green-600" />
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-medium line-through decoration-gray-400">
                            {task.title}
                          </span>
                          {task.projectId && (
                            <span className="text-[10px] text-blue-500">
                              <Folder size={10} className="inline" />{" "}
                              {getProjectName(task.projectId)}
                            </span>
                          )}
                        </div>
                        <span className="text-xs ml-2 bg-gray-100 px-2 py-0.5 rounded">
                          {formatTime(task.totalTime || 0)}
                        </span>
                      </div>
                    </div>
                    <div className="flex gap-2">
                      <button
                        onClick={() => onRepeat(task.id)}
                        className="p-2 text-gray-400 hover:text-indigo-600"
                      >
                        <RotateCcw size={18} />
                      </button>
                      <button
                        onClick={() => onDelete(task.id)}
                        className="p-2 text-gray-400 hover:text-red-600"
                      >
                        <Trash2 size={18} />
                      </button>
                    </div>
                  </li>
                ))}
              </ul>
            )}
          </div>
        </div>
      );

      const ReviewView = () => {
        const [showClearConfirm, setShowClearConfirm] = useState(false);
        const [isCleaning, setIsCleaning] = useState(false);

        const handleClearCache = async () => {
          setIsCleaning(true);
          try {
            localStorage.removeItem("system4x7_tasks_v2");
            localStorage.removeItem("system4x7_categories");
            localStorage.removeItem("system4x7_timer");
            localStorage.clear();
            sessionStorage.clear();
          } catch (e) {
            console.error("Storage clear failed", e);
          }
          try {
            if ("caches" in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map((key) => caches.delete(key)));
            }
          } catch (e) {
            console.error("Cache clear failed", e);
          }
          try {
            if ("indexedDB" in window && window.indexedDB.databases) {
              const dbs = await window.indexedDB.databases();
              for (const db of dbs) {
                window.indexedDB.deleteDatabase(db.name);
              }
            }
          } catch (e) {
            console.error("IDB clear failed", e);
          }
          try {
            if ("serviceWorker" in window) {
              const registrations =
                await navigator.serviceWorker.getRegistrations();
              for (const registration of registrations) {
                await registration.unregister();
              }
            }
          } catch (e) {
            console.error("SW clear failed", e);
          }
          setTimeout(() => window.location.reload(), 100);
        };

        return (
          <div className="space-y-6">
            <header className="flex items-center gap-3">
              <div className="p-3 rounded-lg bg-teal-100 text-teal-600">
                <Play />
              </div>
              <h2 className="text-2xl font-bold text-gray-800">Ревизия</h2>
            </header>
            <div className="grid gap-6 md:grid-cols-2">
              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h3 className="font-bold mb-4">Вечерняя рутина</h3>
                <ul className="space-y-2">
                  {[
                    "Закрыть все вкладки таймеров",
                    "Очистить физический стол",
                    "Выбрать 3 задачи на завтра",
                  ].map((i) => (
                    <li key={i} className="flex gap-2">
                      <input type="checkbox" />
                      <span>{i}</span>
                    </li>
                  ))}
                </ul>
              </div>
              <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h3 className="font-bold mb-4">Еженедельная рутина</h3>
                <ul className="space-y-2">
                  {[
                    "Очистить папку Входящие",
                    "Проверить список Как-нибудь",
                    "Проверить Лист поручений",
                    "Обновить Проекты",
                  ].map((i) => (
                    <li key={i} className="flex gap-2">
                      <input type="checkbox" />
                      <span>{i}</span>
                    </li>
                  ))}
                </ul>
              </div>
            </div>
            <div className="bg-red-50 p-6 rounded-xl border border-red-100 mt-8">
              <h3 className="font-bold text-red-700 mb-2 flex items-center gap-2">
                <Trash size={20} /> Очистка данных
              </h3>
              {!showClearConfirm ? (
                <div>
                  <p className="text-sm text-red-600 mb-4">
                    Это действие полностью удалит все задачи, настройки и
                    историю из этого браузера.
                  </p>
                  <button
                    onClick={() => setShowClearConfirm(true)}
                    className="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition-colors text-sm font-medium"
                  >
                    Очистить кеш
                  </button>
                </div>
              ) : (
                <div className="bg-white p-4 rounded-lg border border-red-200 shadow-sm animate-in fade-in">
                  <p className="font-bold text-red-700 mb-2">
                    Вы точно уверены?
                  </p>
                  <p className="text-sm text-gray-600 mb-4">
                    Все данные будут безвозвратно удалены. Приложение
                    перезагрузится.
                  </p>
                  <div className="flex gap-3">
                    <button
                      onClick={handleClearCache}
                      className="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition-colors text-sm font-bold"
                      disabled={isCleaning}
                    >
                      {isCleaning ? "Очищаю..." : "Да, продолжить"}
                    </button>
                    <button
                      onClick={() => setShowClearConfirm(false)}
                      className="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors text-sm"
                      disabled={isCleaning}
                    >
                      Нет
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<System4x7App />);
    </script>
  </body>
</html>
